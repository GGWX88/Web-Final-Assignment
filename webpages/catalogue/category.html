<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Men Bottom — Fuku</title>
	<link rel="stylesheet" href="../../stylesheet/style.css">
	<link rel="icon" type="image/svg+xml" href="../../img/favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
	<style>
	/*------page menu------*/
		.page-menu {
			padding: 1.1% 0 0.4% 0;
			height: 25vh;
			a {
				text-decoration: none;
				color: gray;
			}
			background-color: #f7f7f7;
		}
		.bottom-border {
			border-bottom: 1px solid #c0c0c0;
		}
		.website-path {
			padding: 0 0 0 2%;
			font-size: 14px;
		}
		.current-page {
			font-weight: bold;
		}
		.page-name {
			text-align: center;
			font-family: 'Manrope';
			font-size: 50px;
		}

	/*------cards------*/
		.catalogue {
			display: flex;
			justify-content: center;
			flex-wrap: wrap;
			padding-bottom: 10vh;
		}
		.card {
			width: 23vw;
			padding-top: 2vh;
			padding-bottom: 2vh;
			float: left;
			display: flex;
			flex-direction: column;
		}
		.card-img {
			width: 90%;
			object-fit: cover;
			display: block;
			margin: 0 auto;
		}
		.card-info {
			padding-top: 1%;
			padding-left: 7%;
		}
		.card-title {
			font-weight: normal;
			font-size: 20px;
			font-family: 'Hanken Grotesk';
		}
		.card-price {
			display: block;
			font-size: 13px;
			color: grey;
		}
	</style>
	<script defer src="./database.js"></script>
	<script defer src="./category.js"></script>
</head>
<body>
	<!------[Navigation Bar (Top)]------>
	<header>
		<a href="../index.html" class="logo">Fuku</a>
		<nav class="main-nav">
			<a href="../index.html">Home</a>
			<a href="../catalogue.html" class="active">Catalogue</a>
			<a href="../about.html">About</a>
			<a href="../review.html">Review</a>
			<a href="../login.html">Member</a>
		</nav>
	</header>

	<!------[Page Menu]------>
	<section class="page-menu bottom-border">
		<template id="page-menu-template">
			<nav class="website-path">
				<a href="../index.html">Home</a>&nbsp;/
				<span class="current-page"></span>
			</nav>
			<p class="page-name"></p>
		</template>
	</section>


	<!------[Catalogue]------>
	<section class="catalogue">
		<template id="card-template">
			<article class="card">
				<a class="product-page">
					<img class="card-img">
				</a>
				<div class="card-info">
					<h5 class="card-title"></h5>
					<span class="card-price">RM&nbsp;<span class="card-price--value"></span></span>
				</div>
			</article>
		</template>
	</section>


	<!------[Navigation Bar (Bottom)]------>
	<footer>
	<div class="footer-top">
		<div class="footer-column">
			<h4>Shop</h4>
			<a href="women.html">Women</a>
			<a href="men.html">Men</a>
		</div>
		<div class="footer-column">
			<h4>About</h4>
			<a href="../about.html">About Us</a>
		</div>
		<div class="footer-column">
			<h4>Support</h4>
			<a href="#">FAQs</a>
			<a href="#">Contact Us</a>
		</div>
		<div class="footer-column">
			<h4>Got a question?</h4>
			<p>+6016-417-5751</p>
			<p>fuku@gmail.com</p>
		</div>
		<div class="footer-column">
			<h4>Get updates when you sign up.</h4>
			<p>Receive the latest updates and more.</p>
			<div class="newsletter">
				<input type="email" placeholder="Enter your email">
				<button>Submit</button>
			</div>
		</div>
	</div>
	<div class="footer-bottom">
		<p>&copy; 2026 Fuku. All rights reserved.</p>
	</div>
</footer>
</body>
</html>
